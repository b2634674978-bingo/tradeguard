services:
  - type: web
    name: tradeguard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      # 填上 Supabase / Neon 的连接串后，数据写入 PostgreSQL，重启不再重置
      - key: DATABASE_URL
        sync: false
      - key: TRADEGUARD_PUBLIC_DEMO
        value: "1"
